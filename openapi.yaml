openapi: 3.0.4
info:
  title: Weather
  description: >-
    Weather is a current weather API that reports conditions for any city name
    or zip code: real-time temperature and wind speed with compass direction, in
    both metric and imperial units. Paid plans add a 7-day forecast with daily
    highs, lows, rain chance and conditions for the week ahead.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/weatherforecast:
    get:
      summary: Weather
      description: Get the current weather for a given location
      operationId: weatherforecast
      parameters:
        - name: city
          in: query
          schema:
            type: string
          required: true
          description: >-
            The city for which you want to get the current weather (e.g., San
            Francisco)
          example: San Francisco
        - name: forecast
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Included by default. Set to false to omit the 7-day forecast and
            return current conditions only.
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
